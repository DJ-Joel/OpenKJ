name: Windows build test

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows Builds
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x86_64
            qt_arch: win64_msvc2019_64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: ${{ matrix.qt_arch }}

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@v1.1

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Create Downloads Directory
      run: mkdir -p downloads

    - name: Download GST Installer
      uses: carlosperate/download-file-action@v2
      id: download-gst
      with:
        file-url: 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi'
        file-name: 'gstreamer.msi'
        location: './downloads'

    - name: Download GST-Dev Installer
      uses: carlosperate/download-file-action@v2
      id: download-gst-dev
      with:
        file-url: 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-devel-msvc-x86_64-1.24.13.msi'
        file-name: 'gstreamer-devel.msi'
        location: './downloads'

    - name: Install GStreamer
      shell: pwsh
      run: |
        $installRoot = "C:\gstreamer"
        $installDir = "C:\gstreamer\1.0\msvc_x86_64"

        Write-Host "Installing GStreamer runtime..."
        $p1 = Start-Process msiexec.exe -ArgumentList "/i", "downloads\gstreamer.msi", "/quiet", "/norestart", "ADDLOCAL=ALL", "INSTALLDIR=$installRoot", "/l*v", "gst-runtime-install.log" -Wait -PassThru
        if ($p1.ExitCode -ne 0) {
          Write-Host "::error::GStreamer runtime install failed with exit code $($p1.ExitCode)"
          Get-Content gst-runtime-install.log -Tail 40
          exit 1
        }

        Write-Host "Installing GStreamer devel..."
        $p2 = Start-Process msiexec.exe -ArgumentList "/i", "downloads\gstreamer-devel.msi", "/quiet", "/norestart", "ADDLOCAL=ALL", "INSTALLDIR=$installRoot", "/l*v", "gst-devel-install.log" -Wait -PassThru
        if ($p2.ExitCode -ne 0) {
          Write-Host "::error::GStreamer devel install failed with exit code $($p2.ExitCode)"
          Get-Content gst-devel-install.log -Tail 40
          exit 1
        }

        Write-Host "Verifying install..."
        if (-not (Test-Path $installDir)) {
          Write-Host "::error::Expected GStreamer directory not found at $installDir"
          Write-Host "Contents of C:\gstreamer (if it exists):"
          Get-ChildItem -Path "C:\gstreamer" -Recurse -Depth 2 -ErrorAction SilentlyContinue
          exit 1
        }
        Write-Host "GStreamer found at $installDir"
        Write-Host "Top-level contents:"
        Get-ChildItem $installDir
        Write-Host ""
        Write-Host "Full recursive listing (depth 2):"
        Get-ChildItem -Path $installDir -Recurse -Depth 2 | Select-Object FullName

    - name: Configure CMake
      env:
        GSTREAMER_1_0_ROOT_MSVC_X86_64: 'C:\gstreamer\1.0\msvc_x86_64'
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_STANDARD=20 `
          -DSPDLOG_USE_BUNDLED=ON `
          -DCMAKE_PREFIX_PATH="C:\gstreamer\1.0\msvc_x86_64"

    - name: Build Project
      run: cmake --build build --config Release

    - name: Create output dir and copy exe
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path output | Out-Null
        Copy-Item build\openkj.exe output\

    - name: Run windeployqt
      shell: cmd
      run: |
        windeployqt --release --compiler-runtime output\openkj.exe
        dir output

    - name: Copy in GStreamer runtime dependencies
      shell: pwsh
      run: |
        $gstDir = "C:\gstreamer\1.0\msvc_x86_64"
        Copy-Item -Path "$gstDir\bin\*.dll" -Destination output\ -Force
        Write-Host "Copied GStreamer runtime DLLs into output\"

        New-Item -ItemType Directory -Path "output\gstreamer-1.0" -Force | Out-Null
        Copy-Item -Path "$gstDir\lib\gstreamer-1.0\*" -Destination "output\gstreamer-1.0\" -Recurse -Force
        Write-Host "Copied GStreamer plugins into output\gstreamer-1.0\"
        Get-ChildItem "output\gstreamer-1.0" | Measure-Object | Select-Object -ExpandProperty Count

        # souphttpsrc needs a GIO TLS backend module to handle https:// URLs
        # (e.g. the Stream feature) - without it, HTTPS streams fail with
        # "Secure connection setup failed. / TLS/SSL support not available".
        $gioModulesSrc = "$gstDir\lib\gio\modules"
        if (Test-Path $gioModulesSrc) {
          New-Item -ItemType Directory -Path "output\gio-modules" -Force | Out-Null
          Copy-Item -Path "$gioModulesSrc\*" -Destination "output\gio-modules\" -Recurse -Force
          Write-Host "Copied GIO TLS modules into output\gio-modules\"
          Get-ChildItem "output\gio-modules"
        } else {
          Write-Host "::warning::Expected GIO modules directory not found at $gioModulesSrc - HTTPS streaming may not work in this build. Check whether the GStreamer MSI's module layout has changed."
        }

    - name: Download Roboto Bold
      uses: carlosperate/download-file-action@v2
      id: download-roboto-bold
      with:
        file-url: 'https://storage.googleapis.com/okj-installer-deps/Roboto-Bold.ttf'
        file-name: 'Roboto-Bold.ttf'
        location: './downloads'

    - name: Download Roboto Medium
      uses: carlosperate/download-file-action@v2
      id: download-roboto-medium
      with:
        file-url: 'https://storage.googleapis.com/okj-installer-deps/Roboto-Medium.ttf'
        file-name: 'Roboto-Medium.ttf'
        location: './downloads'

    - name: Download Roboto Regular
      uses: carlosperate/download-file-action@v2
      id: download-roboto-regular
      with:
        file-url: 'https://storage.googleapis.com/okj-installer-deps/Roboto-Regular.ttf'
        file-name: 'Roboto-Regular.ttf'
        location: './downloads'

    - name: Download Source Code Pro Medium
      uses: carlosperate/download-file-action@v2
      id: download-source-code-pro-medium
      with:
        file-url: 'https://storage.googleapis.com/okj-installer-deps/SourceCodePro-Medium.ttf'
        file-name: 'SourceCodePro-Medium.ttf'
        location: './downloads'

    - name: Download OpenSSL dll files
      uses: carlosperate/download-file-action@v2
      id: download-openssl
      with:
        file-url: 'https://storage.googleapis.com/okj-installer-deps/ssl-x86_64-1.1.1.zip'
        file-name: 'openssl.zip'
        location: './downloads'

    - name: Download VC++ Redistributable
      uses: carlosperate/download-file-action@v2
      id: download-vcredist
      with:
        file-url: 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
        file-name: 'vc_redist.x64.exe'
        location: './downloads'

    - name: Copy in other dependencies
      shell: pwsh
      run: |
        Copy-Item LICENSE output\LICENSE.txt
        Copy-Item downloads\Roboto-Bold.ttf output\
        Copy-Item downloads\Roboto-Medium.ttf output\
        Copy-Item downloads\Roboto-Regular.ttf output\
        Copy-Item downloads\SourceCodePro-Medium.ttf output\
        Copy-Item downloads\vc_redist.x64.exe output\
        & "C:\Program Files\7-Zip\7z.exe" e -bb3 -y downloads\openssl.zip -o"output\"
        Write-Host "output\ contents:"
        Get-ChildItem output

    - name: Create Installer
      shell: cmd
      run: |
        curl.exe -sLO https://files.jrsoftware.org/is/6/innosetup-6.4.3.exe
        .\innosetup-6.4.3.exe /silent
        copy cd\openkj64.iss inst.iss
        mkdir installer
        "%programfiles(x86)%\Inno Setup 6\iscc.exe" inst.iss /Oinstaller\

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenKJ-Windows-Installer
        path: installer\*.exe
